[workspace]
resolver = "2"
members = [
    "crates/oxide-infer-core",
    "crates/oxide-infer-scheduler",
    "crates/oxide-infer-kernels",
    "crates/oxide-infer-models",
    "crates/oxide-infer-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
bytes = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
half = { version = "2.4", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.18", features = ["derive"] }
safetensors = "0.5"
memmap2 = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Cuda-oxide runtime crates
cuda-core = { path = "../cuda-oxide/cuda-core" }
cuda-bindings = { path = "../cuda-oxide/cuda-bindings" }
cuda-async = { path = "../cuda-oxide/cuda-async" }

# Local workspace members
oxide-infer-core = { path = "crates/oxide-infer-core" }
oxide-infer-scheduler = { path = "crates/oxide-infer-scheduler" }
oxide-infer-kernels = { path = "crates/oxide-infer-kernels" }
oxide-infer-models = { path = "crates/oxide-infer-models" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
